name: build-windows-portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Build portable Windows bundle
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: douyin-video-tool-win64
          path: releases/*.zip
          if-no-files-found: error
          compression-level: 0
